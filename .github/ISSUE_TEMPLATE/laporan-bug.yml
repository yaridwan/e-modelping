name: Laporan bug
description: Laporkan sesuatu yang tidak berjalan sebagaimana mestinya
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih telah melapor. **Celah keamanan jangan dilaporkan di sini** — ikuti SECURITY.md.
  - type: textarea
    id: ringkasan
    attributes:
      label: Apa yang terjadi?
      description: Jelaskan masalahnya secara singkat.
    validations:
      required: true
  - type: textarea
    id: langkah
    attributes:
      label: Langkah untuk mereproduksi
      placeholder: |
        1. Buka halaman ...
        2. Klik ...
        3. Muncul ...
    validations:
      required: true
  - type: textarea
    id: harapan
    attributes:
      label: Yang diharapkan
    validations:
      required: true
  - type: dropdown
    id: bagian
    attributes:
      label: Bagian
      options:
        - Website publik (pembaca)
        - Mode buku / penampil PDF
        - Panel admin
        - Instalasi / deploy
        - Lainnya
    validations:
      required: true
  - type: input
    id: lingkungan
    attributes:
      label: Browser / perangkat / versi
      placeholder: "Chrome 142 di Android 15; PHP 8.4.12; MySQL 8.4.6"
  - type: textarea
    id: log
    attributes:
      label: Log atau tangkapan layar
      description: Potongan storage/logs/laravel.log atau konsol browser (hapus data pribadi).
      render: text
