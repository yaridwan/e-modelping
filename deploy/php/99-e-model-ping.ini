; Pengaturan PHP produksi E-Model PING.
; Pasang: sudo cp deploy/php/99-e-model-ping.ini /etc/php/8.4/fpm/conf.d/ && sudo cp deploy/php/99-e-model-ping.ini /etc/php/8.4/cli/conf.d/
;         sudo systemctl reload php8.4-fpm
; Selaraskan batas unggah dengan PING_BATAS_UNGGAH_MAKS_MB (.env) dan client_max_body_size (Nginx).
upload_max_filesize = 30M
post_max_size = 32M
memory_limit = 256M
max_execution_time = 60
expose_php = Off
date.timezone = Asia/Jakarta

; OPcache. validate_timestamps tetap aktif (cek tiap 2 detik) agar cache konfigurasi yang dibangun ulang
; oleh deploy/impor-data.sh langsung terpakai tanpa reload PHP-FPM; deploy.sh tetap me-reload PHP-FPM.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
