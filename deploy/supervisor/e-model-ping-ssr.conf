; Alternatif Supervisor untuk proses SSR (pilih salah satu: systemd ATAU supervisor).
[program:e-model-ping-ssr]
command=/usr/bin/php /var/www/e-model-ping/current/artisan inertia:start-ssr
directory=/var/www/e-model-ping/current
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/e-model-ping/shared/storage/logs/ssr.log
