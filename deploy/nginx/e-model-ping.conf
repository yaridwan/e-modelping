# Contoh konfigurasi Nginx untuk E-Model PING (Laravel 13 + PHP-FPM 8.4/8.5 + SSR Node lokal).
# Ganti emodelping.example dan jalur sesuai server Anda. Sertifikat diasumsikan dari Certbot.

server {
    listen 80;
    listen [::]:80;
    server_name emodelping.example www.emodelping.example;
    return 301 https://emodelping.example$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name emodelping.example;

    ssl_certificate     /etc/letsencrypt/live/emodelping.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emodelping.example/privkey.pem;

    # Document root HANYA folder public/. Kode, .env, vendor, storage tidak terjangkau web.
    root /var/www/e-model-ping/current/public;
    index index.php;
    charset utf-8;

    # Selaraskan dengan PHP (upload_max_filesize/post_max_size) dan PING_BATAS_UNGGAH_MAKS_MB.
    client_max_body_size 30M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset build Vite berhash: cache panjang.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Tolak berkas tersembunyi (.env, .git, dll.).
    location ~ /\.(?!well-known).* { deny all; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }
}
